# Fly.io app configuration for mealplanner.
# See docs/deploy-fly.md for provisioning, secrets, and deploy workflow.

app = "mealplanner"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  NODE_ENV = "production"

[deploy]
  release_command = "npx prisma migrate deploy"
