# fly.toml app configuration file generated for mealplanner-xzvzow on 2026-05-29T06:59:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mealplanner-xzvzow'
primary_region = 'arn'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
